on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools any::RcppGSL any::rmarkdown any::tinytex any::pkgdown
      - name: Install package
        run: R CMD INSTALL .
      - name: Build and deploy pkgdown site
        run: |
          make web_docs
        shell: bash

      - name: Determine deployment directory
        id: deploy-dir
        run: |
          VERSION=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          PART_COUNT=$(echo "$VERSION" | tr '.' '\n' | wc -l)
          if [ "$PART_COUNT" -eq 4 ]; then
            echo "target_dir=${{ secrets.ftp_server_dir }}dev/" >> $GITHUB_OUTPUT
            echo "Deploying development version $VERSION to dev subdirectory"
          else
            echo "target_dir=${{ secrets.ftp_server_dir }}" >> $GITHUB_OUTPUT
            echo "Deploying release version $VERSION to root directory"
          fi
        shell: bash

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.ftp_server }}
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          local-dir: docs/
          server-dir: ${{ steps.deploy-dir.outputs.target_dir }}
          protocol: ftps
